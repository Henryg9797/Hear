<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hear</title>
<meta name="description" content="Your records, all in one place. A record-collection front end for Spotify and Qobuz.">
<meta name="theme-color" content="#EEEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://i.discogs.com">

<link rel="preconnect" href="https://coverartarchive.org">
<link rel="preconnect" href="https://en.wikipedia.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one phone-width column (max 720px) with a fixed bottom tab bar; the artist page's cover flow is the centerpiece. */
:root {
  --bg: #EEEDE8;
  --surface: #FFFFFF;
  --ink: #17181C;
  --muted: #5B5E66;
  --line: #D6D4CC;
  --chip: #E3E1DA;
  --accent: #A8361A;
  --accent-ink: #FFFFFF;
  --shadow: 0 18px 30px rgba(23, 24, 28, 0.22);
  --font: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121317; --surface: #1C1D23; --ink: #EDECE7; --muted: #A4A7AE; --line: #2E3038; --chip: #262830;
    --accent: #E0744F; --accent-ink: #17181C; --shadow: 0 18px 30px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121317; --surface: #1C1D23; --ink: #EDECE7; --muted: #A4A7AE; --line: #2E3038; --chip: #262830;
  --accent: #E0744F; --accent-ink: #17181C; --shadow: 0 18px 30px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

#app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.topbar { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 10px; }
.topbar .brand { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; padding: 0 6px; }
.topbar .ttl { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .spacer { flex: 1; }
.iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; border: 0; background: transparent; color: var(--ink); }
.iconbtn.ring { background: var(--surface); border: 1px solid var(--line); }
.iconbtn svg { width: 22px; height: 22px; }
main { flex: 1; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 50; }
.tabs .row { max-width: 720px; margin: 0 auto; display: flex; height: 62px; }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 500; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a.active { color: var(--ink); font-weight: 600; }

/* Type */
h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; text-wrap: balance; }
h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.section { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* Controls */
.field { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.field svg { width: 20px; height: 20px; flex-shrink: 0; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; }
.field input::-webkit-search-cancel-button { -webkit-appearance: none; }
textarea.area { width: 100%; resize: vertical; min-height: 84px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); font-size: 15px; line-height: 1.4; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.accent { border-color: var(--accent); color: var(--accent); }
.tag { height: 30px; padding: 0 11px; display: inline-flex; align-items: center; border-radius: 15px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.tag.soft { background: var(--chip); border-color: transparent; }
.btn { height: 46px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 23px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: var(--line); font-weight: 600; }
.btn.sm { height: 38px; padding: 0 13px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btnrow { display: flex; gap: 10px; }
.btnrow .btn { flex: 1; min-width: 0; }
.link { color: var(--accent); font-weight: 600; text-decoration: none; }
.notice { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; line-height: 1.45; }
.notice.warn { border-color: var(--accent); }
.card { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card.dark .eyebrow { color: var(--line); }
.card.dark textarea.area { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.18); color: inherit; }
.card.dark textarea.area::placeholder { color: rgba(255, 255, 255, 0.55); }

/* Lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.item:last-child { border-bottom: 0; }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .cover { width: 52px; height: 52px; flex-shrink: 0; }
.item .arrow { color: var(--muted); flex-shrink: 0; }
.item .arrow svg { width: 18px; height: 18px; }

/* Covers */
.cover { position: relative; aspect-ratio: 1; width: 100%; background: var(--chip); border-radius: 4px; overflow: hidden; }
.cover .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; letter-spacing: -0.04em; color: rgba(255, 255, 255, 0.9); font-size: 28%; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.25s; }
.cover.has-img img { opacity: 1; }
.cover.has-img .ph { display: none; }
.cover.big { box-shadow: var(--shadow); border-radius: 6px; }

/* Grid of tiles */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px 12px; }
.tile { display: flex; flex-direction: column; gap: 5px; text-decoration: none; color: inherit; min-width: 0; background: transparent; border: 0; padding: 0; text-align: left; }
.tile .cover { box-shadow: 0 6px 12px rgba(23, 24, 28, 0.18); }
.tile .a { font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .b { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grouphead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-top: 8px; }
.grouphead a { font-weight: 700; text-decoration: none; }

/* Cover flow */
.flow { position: relative; height: 300px; margin: 4px -16px 0; overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 0 calc(50% - 60px); }
.flow::-webkit-scrollbar { display: none; }
.flow .slot { flex: 0 0 120px; height: 240px; scroll-snap-align: center; position: relative; }
.flow .fc { position: absolute; left: 50%; top: 0; width: 240px; height: 240px; margin-left: -120px; padding: 0; border: 0; background: transparent; transition: transform 0.18s ease-out; will-change: transform; }
.flow .fc .cover { width: 240px; height: 240px; box-shadow: var(--shadow); border-radius: 4px; }
.flow .fc .cover .ph { font-size: 64px; }
.years { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
.years::-webkit-scrollbar { display: none; }
.years button { flex-shrink: 0; height: 28px; padding: 0 2px; border: 0; background: transparent; font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 2px solid transparent; }
.years button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.nowplaying { min-height: 64px; display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }

/* Tracks */
.track { display: flex; gap: 12px; align-items: baseline; min-height: 40px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.track .n { font-family: var(--mono); font-size: 12px; color: var(--muted); width: 22px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.track .tt { flex: 1; min-width: 0; }
.track .len { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Ratings & coverage */
.stars { position: relative; display: inline-block; font-size: 22px; line-height: 1; letter-spacing: 2px; color: var(--line); white-space: nowrap; }
.stars .fill { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--accent); }
.stars.sm { font-size: 14px; letter-spacing: 1px; }
.rb { display: inline-flex; align-items: center; gap: 6px; min-height: 16px; }
.rb .stars.sm { font-size: 12px; letter-spacing: 0.5px; }
.rb .rbn { font-family: var(--mono); font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; }
.rb .rbc { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.rb.lg .stars.sm { font-size: 16px; letter-spacing: 1px; }
.rb.lg .rbn { font-size: 13px; font-weight: 600; }
.rb.lg .rbc { font-size: 12px; }
.score { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.srow { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; text-decoration: none; color: inherit; }
.srow:first-of-type { border-top: 0; }
.srow .src { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.srow .raw { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.crow { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.crow:first-child { border-top: 0; }
.crow .t { font-size: 14px; font-weight: 600; line-height: 1.3; }
.crow .m { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.crow .snip { font-size: 13px; color: var(--muted); line-height: 1.35; }
.kind { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--chip); color: var(--ink); margin-right: 6px; vertical-align: 1px; }
.subhead { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 12px 0 4px; }
.about { font-size: 14px; line-height: 1.5; }

/* Album page folds: collapsed rows for reviews, press, about, more like this */
.folds { margin-top: 22px; }
.fold { border-top: 1px solid var(--line); }
.fold:last-child { border-bottom: 1px solid var(--line); }
.fhead { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 10px 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.fhead .ft { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; }
.fhead .fmeta { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; font-variant-numeric: tabular-nums; }
.fhead svg { width: 18px; height: 18px; color: var(--muted); transition: transform 0.18s; flex-shrink: 0; }
.fold.open .fhead svg { transform: rotate(90deg); }
.fbody { padding: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }

/* Review box */
.quote { padding: 12px 14px; background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; font-size: 14px; line-height: 1.45; }

/* Settings */
.setting { display: flex; flex-direction: column; gap: 6px; }
.setting label { font-weight: 600; font-size: 14px; }
.setting .help { font-size: 13px; color: var(--muted); line-height: 1.4; }
.setting input[type="text"], .setting input[type="password"], .setting select { height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; width: 100%; }
.status { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); }
.dot.ok { background: #2E8B57; }

/* Type-ahead suggestions */
.field { position: relative; }
.field:focus-within { z-index: 300; }
.ta { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; padding: 6px; }
.ta-h { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.ta-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border: 0; background: transparent; border-radius: 8px; text-align: left; color: inherit; font: inherit; }
.ta-row.on, .ta-row:hover { background: var(--chip); }
.ta-row .cover { width: 36px; height: 36px; flex-shrink: 0; }
.ta-ic { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 18px; background: var(--chip); color: var(--muted); flex-shrink: 0; }
.ta-ic svg { width: 18px; height: 18px; }
.ta-img { width: 36px; height: 36px; border-radius: 18px; object-fit: cover; flex-shrink: 0; background: var(--chip); }
.ta-main { display: flex; flex-direction: column; min-width: 0; }
.ta-t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ta-s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ta-foot { font-size: 13px; color: var(--muted); padding: 8px 10px; }

/* Horizontal strips of album tiles, artist header, review sheet */
.strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 0 16px; padding: 4px 16px 12px; margin: 0 -16px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip .tile { flex: 0 0 148px; scroll-snap-align: start; }
.tile .tl { display: flex; flex-direction: column; gap: 5px; text-decoration: none; color: inherit; min-width: 0; }
.tile .a2 { font-size: 13px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
.rbtn:hover .rbn { text-decoration: underline; }
.ahead { display: flex; gap: 16px; align-items: flex-start; }
.aimg { width: 104px; height: 104px; flex-shrink: 0; border-radius: 10px; object-fit: cover; background: var(--chip); box-shadow: 0 6px 14px rgba(23, 24, 28, 0.18); }
.aimg.ph { display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 34px; color: rgba(255, 255, 255, 0.9); }
.bio { font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bio.open { display: block; -webkit-line-clamp: unset; }
.sheet-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 720px; max-height: 84vh; overflow: auto; background: var(--bg); color: var(--ink); border-radius: 18px 18px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
@media (min-width: 720px) { .sheet-back { align-items: center; } .sheet { border-radius: 18px; max-height: 80vh; } }
.sheet .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }

/* Skeletons while a row loads */
.skel .cover { background: linear-gradient(90deg, var(--chip) 25%, var(--surface) 50%, var(--chip) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.skel .a, .skel .b { height: 12px; border-radius: 6px; background: var(--chip); }
.skel .b { width: 60%; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel .cover { animation: none; } }

/* Segmented control */
.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.seg button svg { width: 15px; height: 15px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }

/* Home browse: Genres / Moods / Ask Claude */
.browse-seg { margin-top: 12px; }
.browse { padding-top: 12px; }
.gtable { display: flex; flex-direction: column; }
.grow { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.grow:first-child { border-top: 0; padding-top: 2px; }
.ghead { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; text-decoration: none; color: inherit; }
.ghead .mono { flex: 1; }
.ghead svg { width: 18px; height: 18px; color: var(--muted); }
.field.ai .btn { flex-shrink: 0; }

/* Ask Claude: vertical cover flow of recommendations */
h1.aiq { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
html.snapy { scroll-snap-type: y proximity; }
.vflow { display: flex; flex-direction: column; padding-top: 6px; }
.vcard { display: flex; flex-direction: column; gap: 10px; padding: 22px 0 26px; border-top: 1px solid var(--line); scroll-snap-align: start; scroll-margin-top: 10px; }
.vcard:first-child { border-top: 0; }
.vcov { width: min(100%, 320px); margin: 0 auto; will-change: transform, opacity; }
.vcov .cover { box-shadow: var(--shadow); border-radius: 6px; }
.vcov .cover .ph { font-size: 72px; }

<script>
/* ============================================================

// ---------- storage ----------

applyTheme();

// ---------- utilities ----------

function credit(ac) { return (ac || []).map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join('') || 'Unknown artist'; }

  get(url) { const d = this.load(); const e = d[url]; if (!e) return null; if (Date.now() - e.t > 7 * 864e5) { delete d[url]; return null; } return e.v; },

const caa = (rgid, size) => `https://coverartarchive.org/release-group/${rgid}/front-${size || 250}`;

const DG = {

  text(s) { return (s || '').replace(/\[(?:a|l|r|m)=([^\]]+)\]/g, '$1').replace(/\[(?:a|l|r|m)\d+\]/g, '').replace(/\[url=[^\]]*\]([^\[]*)\[\/url\]/g, '$1').replace(/\[\/?(?:b|i|u)\]/g, '').replace(/\r\n/g, '\n').trim(); },

function classifyUrl(u) {
  const s = u.toLowerCase();
  if (s.includes('open.spotify.com/album/')) return 'spotify';
  if (s.includes('qobuz.com/') && s.includes('/album/')) return 'qobuz';
  if (s.includes('bandcamp.com/album/')) return 'bandcamp';
  if (s.includes('music.apple.com/') && s.includes('/album/')) return 'apple';
  if (s.includes('deezer.com/') && s.includes('/album/')) return 'deezer';
  if (s.includes('tidal.com/') && s.includes('/album/')) return 'tidal';
  if (s.includes('discogs.com/master/')) return 'discogs';
  if (s.includes('allmusic.com/album/')) return 'allmusic';
  if (s.includes('pitchfork.com/')) return 'pitchfork';
  if (s.includes('wikidata.org/')) return 'wikidata';
  if (s.includes('wikipedia.org/')) return 'wikipedia';
  if (s.includes('rateyourmusic.com/')) return 'rym';

}

  const prompt = `You are an experienced music critic estimating consensus ratings. For each album below, estimate the rating AllMusic's editors would give on their 1-5 scale (5 = essential, 4 = excellent, 3 = good or solid, 2 = flawed, 1 = poor), judging the record within its genre and the artist's catalog and weighing the critical reception you actually know of (AllMusic, Pitchfork, RYM, Metacritic, Christgau, major press). You cannot hear the music; rate only from what you know, and never invent reception. Use half-stars (x.0 or x.5). If you do not recognize an album or know too little about its reception, set confidence "low" and omit the score. "i" is the album's number below; "why" is one sentence naming the basis, e.g. 'widely regarded as their peak; Pitchfork 8.7, AllMusic 4.5'.\nAlbums:\n${list}`;

    res.albums.forEach((a, i) => addCard(a, i));

    const footer = el('div', { class: 'row', style: { justifyContent: 'center', paddingTop: '12px' } }, el('button', { type: 'button', class: 'btn sm quiet', onclick: () => doRefine('') }, 'Ten different records'));
    out.append(flow, busy, footer);

// The "cover flow" feel: covers tilt and shrink as they leave the focus line, with the document snapping card to card.
function vflowFx(container) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return () => { };
  let ticking = false;
  const update = () => {
    ticking = false;
    const vh = window.innerHeight || 800; const mid = vh * 0.45;
    for (const c of container.querySelectorAll('.vcov')) {
      const r = c.getBoundingClientRect();
      if (r.bottom < -vh || r.top > vh * 2) continue;
      const off = (r.top + r.height / 2 - mid) / vh; // negative above the focus line, positive below
      const d = Math.min(1, Math.abs(off));
      c.style.transform = `perspective(900px) rotateX(${(-off * 16).toFixed(1)}deg) scale(${(1 - 0.1 * d).toFixed(3)})`;
      c.style.opacity = (1 - 0.35 * d).toFixed(2);
    }
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', onScroll, { passive: true }); window.addEventListener('resize', onScroll);
  requestAnimationFrame(update); setTimeout(update, 300);
  return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
}
